name: Cart Service CI/CD - Production

on:
  # push:
  #   branches:
  #     - main
  #   paths:
  #     - 'auth/**'  # Adjust path if needed

  pull_request:
    branches:
      - main
    paths:
      - "cart/**"

jobs:
  deploy-to-gke:
    name: Deploy Auth to GKE
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up GCP Auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: levomart

      - name: Configure Kubeconfig
        run: |
          gcloud container clusters get-credentials levomart-production-cluster \
            --zone asia-south1 \
            --project levomart

      - name: Deploy to GKE
        run: |
          kubectl apply -f k8s/prod/cart

      - name: Verify Rollout
        run: |
          kubectl rollout status deployment/cart
