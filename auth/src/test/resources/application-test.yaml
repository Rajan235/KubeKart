spring:
  profiles:
    active: test

  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      enabled: true
    path: /h2-console

  kafka:
    enabled: false # Optional, use in @ConditionalOnProperty
    bootstrap-servers: dummy:1234
    producer:
      retries: 0
    consumer:
      group-id: dummy
    listener:
      missing-topics-fatal: false

# Disable Kafka auto-configuration completely
spring.autoconfigure.exclude: org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration
