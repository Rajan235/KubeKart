apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: product
  template:
    metadata:
      labels:
        app: product
    spec:
      containers:
        - name: product-container
          image: product:latest
          ports:
            - containerPort: 4000
          env:
            - name: JWT_KEY
              valueFrom:
                secretKeyRef:
                  name: product-secret
                  key: JWT_KEY

            - name: MONGO_URI
              valueFrom:
                configMapKeyRef:
                  name: product-config
                  key: MONGO_URI

            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: product-config
                  key: PORT

            - name: KAFKA_CLIENT_ID
              valueFrom:
                configMapKeyRef:
                  name: product-config
                  key: KAFKA_CLIENT_ID

            - name: KAFKA_BROKERS_ADDRESS
              valueFrom:
                configMapKeyRef:
                  name: product-config
                  key: KAFKA_BROKERS_ADDRESS

---
apiVersion: v1
kind: Service
metadata:
  name: product-service
spec:
  selector:
    app: product
  ports:
    - name: product-service
      protocol: TCP
      port: 4000
      targetPort: 4000
