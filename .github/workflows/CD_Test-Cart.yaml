name: Cart Service CI/CD - Test Branch

on:
  pull_request:
    branches: [test]
    paths: ["cart/**"]

jobs:
  build-and-cloudbuild:
    name: Build & Push with Google Cloud Build
    runs-on: ubuntu-latest
    env:
      REDIS_HOST: localhost
      REDIS_PORT: "6379"
      KAFKA_BROKERS: localhost:9092
      JWT_KEY: dummy-jwt-key
    defaults:
      run:
        working-directory: cart

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build and verify tests
        run: mvn clean verify -B
        continue-on-error: false

      - name: Set up Google Cloud CLI
        uses: google-github-actions/auth@v2
        with:
          credentials_json: "${{ secrets.GCP_SA_KEY }}"

      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: levomart

      - name: Extract short SHA
        id: vars
        run: echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: get file system overview
        run: |
          df -h
          ls -la

      - name: Submit Cloud Build using external file
        run: |
          gcloud builds submit \
            --config=../../k8s/cart/cloudBuild.yaml \
            --project=levomart

      # - name: Submit Cloud Build
      #   run: |
      #     gcloud builds submit auth \
      #       --tag=asia-south1-docker.pkg.dev/levomart/levomart-repo/auth:$SHORT_SHA \
      #       --project=levomart
