name: Auth Service CI/CD - Test Branch

on:
  # push:
  #   branches: [test]
  #   paths: ["auth/**"]
  pull_request:
    branches: [test]
    paths: ["auth/**"]

jobs:
  build-and-cloudbuild:
    name: Build & Push with Google Cloud Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: auth

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build and verify tests
        run: mvn clean verify -B

      - name: Set up Google Cloud CLI
        uses: google-github-actions/auth@v2
        with:
          credentials_json: "${{ secrets.GCP_SA_KEY }}"

      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: levomart

      - name: Extract short SHA
        id: vars
        run: echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Submit Cloud Build using external file
        run: |
          gcloud builds submit \
            --config=k8s/prod/auth/cloudbuild.yaml \
            --project=levomart

      # - name: Submit Cloud Build
      #   run: |
      #     gcloud builds submit auth \
      #       --tag=asia-south1-docker.pkg.dev/levomart/levomart-repo/auth:$SHORT_SHA \
      #       --project=levomart
